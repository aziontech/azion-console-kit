# Versioning contract-drift — scheduled API safety net.
#
# ROLE (spec `versioning-test-coverage`, req 5.4 / task 8.3, deploy safety):
# runs the `contract-drift` Playwright project against a live environment to
# detect when the real Version API diverges from the yup schemas the front's
# adapters assume (tests/contracts/schemas/**). This is API-only (Playwright
# `request` — no browser), so node:22-alpine is enough; no browser install.
#
# NON-BLOCKING BY DESIGN: this is a scheduled *warning*, not a gate. It never
# blocks a merge or a deploy — it surfaces drift early so the team can react
# before the pre-deploy check (deploy-stage.yml / deploy-production.yml) turns red.
#
# GUARD: the spec itself skips cleanly (exit 0) when CONTRACT_API_BASE_URL is
# unset (see tests/contracts/version-api-drift.contract.spec.js). So until the
# CONTRACT_API_* secrets exist this job is green with every test skipped — no
# extra guard logic needed here.
name: Versioning Contract Drift

on:
  schedule:
    # Weekdays 06:00 UTC — early enough to react before the working day.
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional API base URL override (falls back to the CONTRACT_API_BASE_URL secret)'
        required: false
        type: string

env:
  HUSKY: 0

jobs:
  contract-drift:
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SO deps
        run: apk add curl git bash

      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      - name: Run contract-drift (API-only, no browser)
        run: npx playwright test --project=contract-drift
        env:
          # Secret wins; workflow_dispatch input is the manual override.
          # Unset -> spec skips all tests and exits 0 (see guard note above).
          CONTRACT_API_BASE_URL: ${{ secrets.CONTRACT_API_BASE_URL || inputs.base_url }}
          CONTRACT_API_TOKEN: ${{ secrets.CONTRACT_API_TOKEN }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
