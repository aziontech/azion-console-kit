# Versioning contract-drift — scheduled API safety net.
#
# ROLE (spec `versioning-test-coverage`, req 5.4 / task 8.3, deploy safety):
# runs the `contract-drift` Playwright project against the PUBLISHED OpenAPI
# spec of an environment (an open, no-auth `/schema/` URL) to detect when the
# documented Version API diverges from the yup schemas the front's adapters
# assume (tests/contracts/schemas/**). API-only (Playwright `request` — no
# browser, no token), so node:22-alpine is enough; no browser install.
#
# NON-BLOCKING BY DESIGN: this is a scheduled *warning*, not a gate. It never
# blocks a merge or a deploy — it surfaces drift early so the team can react
# before the pre-deploy check in the deploy pipeline turns red.
#
# GUARD: the spec itself skips cleanly (exit 0) when OPENAPI_SCHEMA_URL is unset
# or the URL is unreachable/non-JSON (see
# tests/contracts/version-api-drift.contract.spec.js). The URL is PUBLIC, so it
# lives in `vars` (not secrets) with a default; there is nothing to gate on.
name: Versioning Contract Drift

on:
  schedule:
    # Weekdays 06:00 UTC — early enough to react before the working day.
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      schema_url:
        description: 'Optional published OpenAPI schema URL override (falls back to the OPENAPI_SCHEMA_URL var / default)'
        required: false
        type: string

env:
  HUSKY: 0

permissions:
  contents: read

concurrency:
  group: versioning-contract-drift
  cancel-in-progress: false

jobs:
  contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:22-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SO deps
        run: apk add curl git bash

      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      - name: Run contract-drift (published OpenAPI, no browser, no token)
        run: npx playwright test --project=contract-drift
        env:
          # Manual override wins; else the repo var; else the public default.
          # Unreachable/non-JSON -> spec skips all tests and exits 0 (see guard).
          # STAGE fallback on purpose: the version endpoints exist on stage but
          # NOT on production yet — the prod URL fails all 8 resources today
          # (verified 2026-07-23). Override via the repo var / dispatch input.
          OPENAPI_SCHEMA_URL: ${{ inputs.schema_url || vars.OPENAPI_SCHEMA_URL || 'https://stage-api.azion.com/v4/openapi/openapi.yaml' }}
          # Scheduled run is STRICT: an unreachable/unparseable spec FAILS the
          # job (and notifies) instead of skipping every test silently green.
          DRIFT_STRICT: '1'

      # spec ci-maturity (req 2.1): scheduled failures are never silent.
      - name: Notify failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
          context: 'Drift de contrato agendado falhou (OpenAPI publicado × schemas do front)'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
