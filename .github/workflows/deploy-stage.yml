name: Deploy Console Kit (STAGE)
on:
  push:
    branches:
      - dev
env:
  HUSKY: 0
  CLI_VERSION: 4.15.0

# spec ci-maturity (req 4.1): least-privilege token — deploy auth uses its own
# secrets, the GITHUB_TOKEN only reads the repo.
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    # spec ci-maturity (req 3.1): ~2x the measured typical duration (8.2 min).
    timeout-minutes: 20
    concurrency:
      group: deploy-console-stage
      cancel-in-progress: false
    container:
      image: node:22-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Install SO deps
        run: apk add curl git bash jq

      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      - name: Download Azion CLI
        run: |
          wget https://github.com/aziontech/azion/releases/download/${CLI_VERSION}/azion_${CLI_VERSION}_linux_amd64.apk
          apk add --allow-untrusted azion_${CLI_VERSION}_linux_amd64.apk

      - name: Configure Azion CLI
        run: azion -t ${{ secrets.PLATFORM_KIT_TOKEN }}

      # Contract drift pre-deploy check — validates the STAGE published OpenAPI
      # spec (open /schema/ URL, no token) against the adapter schemas before
      # publishing. API-only (no browser); runs in this same node:22-alpine
      # container after yarn install:lock above.
      # reporting-only until the team promotes it to blocking (remove
      # continue-on-error) — spec versioning-test-coverage ADR 7.6.
      # Unreachable/non-JSON -> spec skips -> step is green. Real drift -> step is
      # red but does NOT block the deploy (flip to blocking is an explicit decision).
      - name: Contract drift pre-deploy check
        id: drift
        continue-on-error: true
        run: npx playwright test --project=contract-drift
        env:
          OPENAPI_SCHEMA_URL: ${{ vars.OPENAPI_SCHEMA_URL_STAGE || 'https://stage-api.azion.com/v4/openapi/openapi.yaml' }}

      - name: Build & Deploy
        run: azion deploy --auto --local --debug --config-dir azion/stage
        env:
          VITE_STRIPE_TOKEN_STAGE: ${{ secrets.STAGE_STRIPE_TOKEN }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.STAGE_RECAPTCHA_SITE_KEY }}
          VITE_SEGMENT_TOKEN: ${{ secrets.STAGE_SEGMENT_TOKEN }}
          CROSS_EDGE_SECRET: ${{ secrets.STAGE_CROSS_EDGE_SECRET}}
          NODE_ENV: stage
          VITE_ENVIRONMENT: stage
          VITE_STAGE_SENTRY: ${{ secrets.STAGE_SENTRY }}
          VITE_SSO_GITHUB: ${{ secrets.STAGE_SSO_GITHUB }}
          VITE_SSO_GOOGLE: ${{ secrets.STAGE_SSO_GOOGLE }}
          VITE_SSO_AZURE: ${{ secrets.STAGE_SSO_AZURE }}
          VITE_SSO_IDP_SCIM_E2E: ${{ secrets.STAGE_SSO_IDP_SCIM_E2E }}
          VITE_SENTRY_AUTH_TOKEN: ${{ secrets.STAGE_SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_UPLOAD: true
          VITE_APPCUES_ACCOUNT_ID: ${{ secrets.APPCUES_ACCOUNT_ID }}
