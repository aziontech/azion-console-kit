name: Deploy Console Kit (PRODUCTION)

on:
  push:
    branches:
      - main

env:
  HUSKY: 0
  CLI_VERSION: 4.15.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-console-production
      cancel-in-progress: false
    container:
      image: node:22-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install SO deps
        run: apk add curl git bash jq
        
      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      - name: Download Azion CLI
        run: |
          wget https://github.com/aziontech/azion/releases/download/${CLI_VERSION}/azion_${CLI_VERSION}_linux_amd64.apk
          apk add --allow-untrusted azion_${CLI_VERSION}_linux_amd64.apk

      - name: Configure Azion CLI
        run: azion -t ${{ secrets.PLATFORM_KIT_TOKEN }}

      # Contract drift pre-deploy check — validates the PRODUCTION Version API
      # against the adapter schemas before publishing. API-only (no browser); runs
      # in this same node:22-alpine container after yarn install:lock above.
      # reporting-only until the secrets are configured and the team promotes it to
      # blocking (remove continue-on-error) — spec versioning-test-coverage ADR 7.6.
      # No secrets -> spec skips -> step is green. Secrets + real drift -> step is
      # red but does NOT block the deploy (flip to blocking is an explicit decision).
      - name: Contract drift pre-deploy check
        continue-on-error: true
        run: npx playwright test --project=contract-drift
        env:
          CONTRACT_API_BASE_URL: ${{ secrets.CONTRACT_API_BASE_URL_PROD }}
          CONTRACT_API_TOKEN: ${{ secrets.CONTRACT_API_TOKEN_PROD }}

      - name: Build & Deploy
        run: azion deploy --auto --local --debug --config-dir azion/production
        env:
          NODE_ENV: production
          VITE_ENVIRONMENT: production
          VITE_STRIPE_TOKEN_PROD: ${{ secrets.PROD_STRIPE_TOKEN }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.PROD_RECAPTCHA_SITE_KEY }}
          VITE_SEGMENT_TOKEN: ${{ secrets.PROD_SEGMENT_TOKEN }}
          CROSS_EDGE_SECRET: ${{ secrets.PROD_CROSS_EDGE_SECRET}}
          VITE_PROD_SENTRY: ${{ secrets.PROD_SENTRY }}
          VITE_SSO_GITHUB: ${{ secrets.PROD_SSO_GITHUB }}
          VITE_SSO_GOOGLE: ${{ secrets.PROD_SSO_GOOGLE }}
          VITE_SENTRY_AUTH_TOKEN: ${{ secrets.PROD_SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_UPLOAD: true
          VITE_APPCUES_ACCOUNT_ID: ${{ secrets.APPCUES_ACCOUNT_ID }}
