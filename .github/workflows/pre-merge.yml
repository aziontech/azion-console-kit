name: Pre-merge

# THE single validation path before any merge (spec ci-maturity, req 1.x):
# static checks (lint/security/governance/build) + unit + contracts + functional
# all converge into ONE aggregate gate (`pre-merge-gate`) — the intended single
# required check for branch protection. Suite stages follow the dependency
# pyramid: contracts (foundation) gate the functional suite (behavior on top),
# while unit runs in parallel (longest job — chaining it would delay every PR;
# measured analysis: CI-FLUXO-DE-TESTES / spec ci-maturity ADR in design.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - dev

env:
  HUSKY: 0
  # Workspace-relative yarn cache so actions/cache behaves identically inside
  # any container image (alpine, playwright-jammy) — spec ci-maturity ADR-7.
  YARN_CACHE_FOLDER: .yarn-ci-cache

permissions:
  contents: read

# Cancel superseded runs of the SAME ref on pull_request only. On push to `dev`
# we let runs finish (cancel-in-progress false) so we never abort a merge-commit
# CI mid-flight.
concurrency:
  group: pre-merge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Stage 0: static (migrated from eslint.yml — same commands, spec req 8.3) ──
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:22-alpine
    steps:
      - name: Install SO deps
        run: apk add --no-cache curl bash git tar zstd

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn-ci-cache
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-cache-

      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      - name: Run Prettier Formatting
        run: yarn prettier --check src/

      - name: Run ESLint
        run: yarn lint

  # Migrated from eslint-security-check.yaml — same commands (spec req 8.3).
  lint-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: node:22-alpine
    steps:
      - name: Install SO deps
        run: apk add curl bash git tar zstd

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn-ci-cache
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-cache-

      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      # Context values flow through env (never interpolated into run blocks) —
      # zizmor template-injection hardening (spec fix-compliance-check, phase 2).
      - name: Run eslint security check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: yarn lint:security-check:changed --base "origin/$BASE_REF"

      - name: Run eslint security check
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: yarn lint:security-check:changed --base "$BEFORE_SHA"

  # Migrated from eslint-azion-governance.yml — same commands (spec req 8.3).
  lint-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: node:22-alpine
    steps:
      - name: Install SO deps
        run: apk add --no-cache curl bash git tar zstd

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch PR base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Restore yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn-ci-cache
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-cache-

      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      - name: Architecture Lint (Changed Files)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: yarn lint:architecture:changed --base "origin/$BASE_REF"

      - name: Architecture Conformance Report
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          yarn architecture:report --format markdown >> $GITHUB_STEP_SUMMARY

  # Build integrity — extracted from the old eslint.yml (same command block).
  build-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:22-alpine
    steps:
      - name: Install SO deps
        run: apk add --no-cache curl bash git tar zstd

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn-ci-cache
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-cache-

      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      - name: Checking Build Integrity
        run: |
          yarn build
          rm -rf dist
          rm -rf coverage

  # ── Stage 1: hermetic suites ──
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: node:22-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install SO deps
        run: apk add curl bash git tar zstd

      - name: Restore yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn-ci-cache
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-cache-

      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      - name: Run tests
        run: yarn test:unit:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage_unit_report
          path: |
            coverage/unit/lcov.info
            coverage/unit/sonar-report.xml
          retention-days: 1

      # Gate summary input (req 6.3/6.3.1) — runs even on failure so the gate
      # can report WHERE and WHY.
      - name: Build suite summary
        if: always()
        run: node scripts/ci/suite-summary.mjs coverage/unit/vitest-summary.json unit .gate/suite-summary-unit.json

      - name: Upload suite summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-summary-unit
          path: .gate/suite-summary-unit.json
          retention-days: 1

  # Detect whether this PR/push touches versioning surfaces. Downstream jobs
  # (functional, contract-consumer) only run when `versioning == 'true'`, so
  # unrelated changes pay zero extra CI cost.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versioning: ${{ steps.filter.outputs.versioning }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # On pull_request the action auto-detects the PR base; on push to dev
          # we compare against the dev branch explicitly.
          base: ${{ github.event_name == 'push' && 'dev' || github.base_ref }}
          filters: |
            versioning:
              - 'src/composables/versioning/**'
              - 'src/templates/version-shell-block/**'
              - 'src/components/VersionListDataView/**'
              - 'src/services/v2/versioning/**'
              - 'src/services/v2/**/*version*'
              - 'src/tests/functional/**'
              - 'src/tests/**/versioning/**'
              - 'tests/**'
              - 'vitest.functional.config.js'
              - 'playwright.config.ts'
              - '.github/workflows/pre-merge.yml'

  # Consumer contract tests for the versioning services (schema sanity checks).
  # Runs in the same node:22-alpine container as run-tests for parity.
  # FOUNDATION of the dependency pyramid: functional only runs on top of a
  # green contract (req 1.7).
  contract-consumer:
    needs: [changes]
    if: needs.changes.outputs.versioning == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:22-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SO deps
        run: apk add curl bash git tar zstd

      - name: Restore yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn-ci-cache
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-cache-

      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      # verbose: the 80 contract tests listed by name; coverage suppressed —
      # it measured nothing useful in this job and buried the story (req 6.1).
      - name: Run consumer contract tests
        run: TZ=UTC npx vitest run --config vitest.config.js --coverage.enabled=false --reporter=verbose --reporter=json --outputFile.json=.gate/contract-report.json src/tests/contracts

      - name: Build suite summary
        if: always()
        run: node scripts/ci/suite-summary.mjs .gate/contract-report.json contract .gate/suite-summary-contract.json

      - name: Upload suite summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-summary-contract
          path: .gate/suite-summary-contract.json
          retention-days: 1

  # ── Stage 2: real browser (runs only on a green contract foundation) ──
  # Functional suite = Vitest BROWSER MODE (real Chromium via Playwright).
  # Runs in the official Playwright image pinned to the SAME version resolved in
  # yarn.lock (playwright 1.61.1) so the pre-installed browsers match the
  # @vitest/browser-playwright runtime exactly — no browser download at runtime.
  functional:
    # contract-consumer is a prerequisite (req 1.7): a broken contract fails in
    # ~1 min without spinning 2 browser runners. Wall-clock cost of the chain is
    # zero — the critical path remains run-tests (see design.md).
    needs: [changes, contract-consumer]
    if: needs.changes.outputs.versioning == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      # SENTINEL: this tag MUST match the playwright version pinned in yarn.lock
      # (see the playwright entry in yarn.lock). A lockfile bump without bumping this tag
      # causes silent browser/runtime skew in the functional job.
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn-ci-cache
          key: yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-cache-

      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      - name: Run functional tests (shard ${{ matrix.shard }}/2)
        run: yarn test:functional --shard=${{ matrix.shard }}/2

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-artifacts-shard-${{ matrix.shard }}
          path: |
            src/tests/functional/__screenshots__
            test-results
          retention-days: 4

      - name: Build suite summary
        if: always()
        run: node scripts/ci/suite-summary.mjs test-results/functional-summary.json functional-shard-${{ matrix.shard }} .gate/suite-summary-functional-${{ matrix.shard }}.json

      - name: Upload suite summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-summary-functional-${{ matrix.shard }}
          path: .gate/suite-summary-functional-${{ matrix.shard }}.json
          retention-days: 1

  # ── The gate: ONE stable name aggregating EVERY suite (req 1.2/1.8) ──
  # This is the intended single required check for branch protection (applying
  # it is repo config — spec ci-maturity ADR-15, only with explicit team
  # approval). Mandatory jobs must be 'success'; functional/contract may be
  # 'skipped' ONLY via the path filter (skip-by-dependency-failure is caught
  # because the failing dependency itself reddens the gate).
  pre-merge-gate:
    needs:
      [
        lint,
        lint-security,
        lint-governance,
        build-integrity,
        run-tests,
        changes,
        functional,
        contract-consumer
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download suite summaries
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: suite-summary-*
          path: .gate-summaries
          merge-multiple: true

      # The report (req 6.3/6.3.1): totals per suite + where/why it failed.
      - name: Publish consolidated report
        run: node scripts/ci/gate-summary.mjs .gate-summaries

      - name: Evaluate upstream results
        run: |
          fail=0

          # The digest puts WHAT/WHERE failed inside THIS step's log — the
          # first place people click on a red gate (clarity follow-up of
          # req 6.3.1; the full report stays in the run Summary tab).
          if [ -f .gate-summaries/digest.txt ]; then
            echo "═══ Resultado por suíte ═══"
            cat .gate-summaries/digest.txt
            echo "═══════════════════════════"
          fi

          check_required() {
            if [ "$2" != "success" ]; then
              echo "::error::pre-merge-gate: required job '$1' did not succeed (result: $2)"
              fail=1
            fi
          }
          check_skippable() {
            if [ "$2" != "success" ] && [ "$2" != "skipped" ]; then
              echo "::error::pre-merge-gate: job '$1' failed (result: $2)"
              fail=1
            fi
          }

          check_required "lint"            '${{ needs.lint.result }}'
          check_required "lint-security"   '${{ needs.lint-security.result }}'
          check_required "lint-governance" '${{ needs.lint-governance.result }}'
          check_required "build-integrity" '${{ needs.build-integrity.result }}'
          check_required "run-tests"       '${{ needs.run-tests.result }}'
          check_required "changes"         '${{ needs.changes.result }}'
          check_skippable "contract-consumer" '${{ needs.contract-consumer.result }}'
          check_skippable "functional"        '${{ needs.functional.result }}'

          if [ "$fail" -ne 0 ]; then
            echo "::error::pre-merge-gate failed — failing tests listed above (Resultado por suíte) and in the Annotations/Summary tabs"
            exit 1
          fi
          echo "pre-merge-gate passed"
