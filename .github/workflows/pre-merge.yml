name: Pre-merge
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - dev

env:
  HUSKY: 0

# Cancel superseded runs of the SAME ref on pull_request only. On push to `dev`
# we let runs finish (cancel-in-progress false) so we never abort a merge-commit
# CI mid-flight.
concurrency:
  group: pre-merge-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-tests:
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SO deps
        run: apk add curl bash git

      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      - name: Run tests
        run: yarn test:unit:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage_unit_report
          path: |
            coverage/unit/lcov.info
            coverage/unit/sonar-report.xml
          retention-days: 1

  # Detect whether this PR/push touches versioning surfaces. Downstream jobs
  # (functional, contract-consumer) only run when `versioning == 'true'`, so
  # unrelated changes pay zero extra CI cost.
  changes:
    runs-on: ubuntu-latest
    outputs:
      versioning: ${{ steps.filter.outputs.versioning }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # On pull_request the action auto-detects the PR base; on push to dev
          # we compare against the dev branch explicitly.
          base: ${{ github.event_name == 'pull_request' && '' || 'dev' }}
          filters: |
            versioning:
              - 'src/composables/versioning/**'
              - 'src/templates/version-shell-block/**'
              - 'src/components/VersionListDataView/**'
              - 'src/services/v2/versioning/**'
              - 'src/services/v2/**/*version*'
              - 'src/tests/functional/**'
              - 'src/tests/**/versioning/**'
              - 'tests/**'
              - 'vitest.functional.config.js'
              - 'playwright.config.ts'
              - '.github/workflows/pre-merge.yml'

  # Functional suite = Vitest BROWSER MODE (real Chromium via Playwright).
  # Runs in the official Playwright image pinned to the SAME version resolved in
  # yarn.lock (playwright 1.61.1) so the pre-installed browsers match the
  # @vitest/browser-playwright runtime exactly — no browser download at runtime.
  functional:
    needs: [changes]
    if: needs.changes.outputs.versioning == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      - name: Run functional tests (shard ${{ matrix.shard }}/2)
        run: yarn test:functional --shard=${{ matrix.shard }}/2

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-artifacts-shard-${{ matrix.shard }}
          path: |
            src/tests/functional/__screenshots__
            test-results
          retention-days: 4

  # Consumer contract tests for the versioning services (schema sanity checks).
  # Runs in the same node:22-alpine container as run-tests for parity.
  contract-consumer:
    needs: [changes]
    if: needs.changes.outputs.versioning == 'true'
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SO deps
        run: apk add curl bash git

      - name: Install dependencies --frozen-lockfile
        run: yarn install:lock

      - name: Run consumer contract tests
        run: TZ=UTC npx vitest run --config vitest.config.js src/tests/contracts

  # Aggregate gate for the versioning test suites. This is the intended FUTURE
  # single required check for branch protection (do NOT add it to required
  # checks here — that is branch-protection config, out of scope for this file).
  # Passes when every upstream need is 'success' OR 'skipped' (skipped == the PR
  # did not touch versioning surfaces).
  versioning-tests-gate:
    needs: [functional, contract-consumer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate upstream results
        run: |
          functional='${{ needs.functional.result }}'
          contract='${{ needs.contract-consumer.result }}'
          echo "functional=$functional contract-consumer=$contract"
          for result in "$functional" "$contract"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::versioning-tests-gate failed (a required suite did not succeed)"
              exit 1
            fi
          done
          echo "versioning-tests-gate passed"
