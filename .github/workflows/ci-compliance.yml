name: Compliance

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 9 * * 1'

permissions: {}

concurrency:
  group: ci-compliance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compliance:
    name: Engineering Compliance
    runs-on: ubuntu-latest # public repo — OSS strategy
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # PR comment with compliance report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      - uses: aziontech/azion-action-compliance@v0
