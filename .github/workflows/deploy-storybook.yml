name: Deploy Storybook

on:
  push:
    branches:
      - dev
    paths:
      - 'storybook/**'

concurrency:
  group: deploy-storybook
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # spec ci-maturity (req 4.1): the job only builds and deploys via the Azion
    # CLI token — the GITHUB_TOKEN needs read only.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'yarn'

      - name: Install Azion CLI
        run: |
          curl -o azionlinux https://downloads.azion.com/linux/x86_64/azion
          sudo mv azionlinux /usr/bin/azion
          sudo chmod u+x /usr/bin/azion

      - name: CLI version
        run: azion --version
        
      - name: Configure token
        run: |
          azion -t ${{ secrets.AZION_PERSONAL_TOKEN }}

      - name: Install storybook dependencies
        run: |
          yarn storybook:install
      
      - name: Building Storybook
        run: yarn storybook:build
          
      - name: Azion Deploy
        run: |
          yarn storybook:deploy
