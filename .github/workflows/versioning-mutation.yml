# Mutation testing (StrykerJS) over the versioning pure-logic modules — the
# automation of the anti-placebo requirement 1.4 (spec versioning-test-coverage):
# Stryker breaks the code on purpose; a surviving mutant means no test noticed.
# REPORTING-ONLY for now (thresholds.break=null in stryker.config.mjs); the
# score gate is calibrated after the survivor report stabilizes (design Q8).
name: Versioning Mutation Testing
on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

env:
  HUSKY: 0

permissions:
  contents: read

concurrency:
  group: versioning-mutation
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    timeout-minutes: 60
    steps:
      - name: Install SO deps
        run: apk add curl bash git

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Stryker (versioning modules)
        run: yarn test:mutation

      # spec ci-maturity (req 2.1): scheduled failures are never silent.
      - name: Notify failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
          context: 'Mutation testing agendado falhou (Stryker — módulos de versionamento)'

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 14
