services:
  azion-console-kit:
    container_name: azion-console-kit
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_ENVIRONMENT=${VITE_ENVIRONMENT:-stage}
    stdin_open: true
    tty: true
