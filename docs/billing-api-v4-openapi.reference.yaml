# Commitments / Credit Limits / cost_breakdown / members: [Future / Phase 2]
#
# ── Conventions ──────────────────────────────────────────────────────────────
# - Envelope: single-resource responses wrapped as { state: "executed", data: <Resource> }.
#   list responses are paginated { count, total_pages, page, page_size, next, previous, results }.
#   EXCEPTIONS (bare arrays, NO envelope): list_payment_methods, list_invoice_lines,
#     list_invoice_settlements, list_payment_refunds, list_budget_alerts, list_spend_limits,
#     list_credit_limits, list_billing_account_members. Internal endpoints return the bare schema.
# - Errors: application/vnd.api+json JSON:API { errors:[{status,code,title,detail,source,meta}] }.
# - Money: integer minor units (cents). currency: ISO-4217 (3). country: ISO 3166 (2).
# - IDs: int64. Pagination: page (1..10000), page_size (1..100, default 20), fields (reserved).
# - Idempotency: header `idempotency-key` on charge/change/pay/refund/action/create.
# - Self-service singletons via /current (ADR-13: 409 when context resolves to >1).
#
# Full schemas live in the original spec; key field lists captured in the gap-analysis doc.
